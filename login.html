<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b1222;
  color:#e2e8f0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.bg-dots{
  position:fixed;inset:0;
  background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
}
.card{
  background:#111827;
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;
  padding:36px 40px;
  width:420px;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.logo-circle{
  width:60px;height:60px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  font-size:26px;
}
h1{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{text-align:center;color:#64748b;font-size:14px;margin-bottom:24px}

.tabs{
  display:flex;
  background:#1e293b;
  border-radius:10px;
  padding:4px;
  margin-bottom:24px;
  gap:4px;
}
.tab{
  flex:1;padding:9px;text-align:center;
  border-radius:7px;cursor:pointer;
  font-size:14px;font-weight:600;
  color:#64748b;
  transition:all .2s;
}
.tab.active{background:#2563eb;color:#fff}

.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#cbd5e1}
input{
  width:100%;padding:12px 14px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:9px;color:#e2e8f0;
  font-size:14px;font-family:inherit;
  transition:border-color .2s;
  outline:none;
}
input:focus{border-color:#3b82f6}
input::placeholder{color:#475569}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn-primary{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none;border-radius:9px;
  color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;
  margin-top:6px;
  transition:opacity .2s,transform .1s;
  font-family:inherit;
}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}

.demo-hint{
  text-align:center;font-size:13px;
  color:#475569;margin-top:18px;
}
.error-msg{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.3);
  color:#f87171;
  border-radius:8px;padding:10px 14px;
  font-size:13px;margin-bottom:14px;
  display:none;
}
.success-msg{
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.3);
  color:#4ade80;
  border-radius:8px;padding:10px 14px;
  font-size:13px;margin-bottom:14px;
  display:none;
}
.help-btn{
  position:fixed;bottom:24px;right:24px;
  width:36px;height:36px;
  background:#1e293b;border:1px solid rgba(255,255,255,.1);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#64748b;font-size:15px;cursor:pointer;
  font-family:inherit;
}
</style>
</head>
<body>
<div class="bg-dots"></div>

<div class="card">
  <div class="logo-circle">💳</div>
  <h1>Smart Expense Tracker</h1>
  <p class="subtitle">Sign in to manage your finances</p>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <div id="error-msg" class="error-msg"></div>
  <div id="success-msg" class="success-msg"></div>

  <!-- LOGIN FORM -->
  <div id="login-form">
    <div class="form-group">
      <label>Username</label>
      <input id="login-username" placeholder="Enter your username" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="login-password" type="password" placeholder="Enter your password">
    </div>
    <button class="btn-primary" onclick="doLogin()">&#x2192;&nbsp; Login</button>
    <p class="demo-hint">Demo: Use any username and password to login</p>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signup-form" style="display:none">
    <div class="row2">
      <div class="form-group">
        <label>First Name</label>
        <input id="signup-fname" placeholder="John">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input id="signup-lname" placeholder="Doe">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="signup-email" type="email" placeholder="john@example.com">
    </div>
    <div class="form-group">
      <label>Username</label>
      <input id="signup-username" placeholder="Choose a username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="signup-password" type="password" placeholder="Create a password (min 4 chars)">
    </div>
    <button class="btn-primary" onclick="doSignup()">&#x2714;&nbsp; Create Account</button>
  </div>
</div>

<button class="help-btn">?</button>

<script>
function switchTab(t){
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-signup').classList.toggle('active', t==='signup');
  document.getElementById('login-form').style.display = t==='login'?'block':'none';
  document.getElementById('signup-form').style.display = t==='signup'?'block':'none';
  hideMessages();
}
function showError(msg){
  const el=document.getElementById('error-msg');
  el.textContent=msg; el.style.display='block';
  document.getElementById('success-msg').style.display='none';
}
function showSuccess(msg){
  const el=document.getElementById('success-msg');
  el.textContent=msg; el.style.display='block';
  document.getElementById('error-msg').style.display='none';
}
function hideMessages(){
  document.getElementById('error-msg').style.display='none';
  document.getElementById('success-msg').style.display='none';
}
function doLogin(){
  const u=document.getElementById('login-username').value.trim();
  const p=document.getElementById('login-password').value;
  if(!u||!p){showError('Please enter username and password');return;}
  const users=JSON.parse(localStorage.getItem('et_users')||'{}');
  let userId,userData;
  if(users[u]){
    if(users[u].password!==p){showError('Incorrect password');return;}
    userId=users[u].id; userData=users[u];
  } else {
    userId='user_'+Date.now();
    userData={id:userId,username:u,firstName:u,lastName:'',email:u+'@example.com',password:p};
    users[u]=userData;
    localStorage.setItem('et_users',JSON.stringify(users));
  }
  localStorage.setItem('et_current_user',JSON.stringify({id:userId,...userData}));
  window.location.href='index.html';
}
function doSignup(){
  const fn=document.getElementById('signup-fname').value.trim();
  const ln=document.getElementById('signup-lname').value.trim();
  const em=document.getElementById('signup-email').value.trim();
  const u=document.getElementById('signup-username').value.trim();
  const p=document.getElementById('signup-password').value;
  if(!fn||!u||!p){showError('First name, username, and password are required');return;}
  if(p.length<4){showError('Password must be at least 4 characters');return;}
  const users=JSON.parse(localStorage.getItem('et_users')||'{}');
  if(users[u]){showError('Username already taken');return;}
  const userId='user_'+Date.now();
  users[u]={id:userId,username:u,firstName:fn,lastName:ln,email:em||u+'@example.com',password:p};
  localStorage.setItem('et_users',JSON.stringify(users));
  showSuccess('Account created! You can now login.');
  setTimeout(()=>switchTab('login'),1500);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('login-form').style.display!=='none') doLogin();
    else doSignup();
  }
});
</script>
</body>
</html>
